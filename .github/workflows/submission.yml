name: Plugin submission

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  submit:
    if: contains(github.event.issue.labels.*.name, 'plugin-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/submission.mjs --event "$GITHUB_EVENT_PATH" --comment "$RUNNER_TEMP/comment.md" --github-output "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.check.outputs.status == 'success'
        run: node scripts/validate.mjs
      - id: pr
        if: steps.check.outputs.status == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/submission-${{ github.event.issue.number }}
          delete-branch: true
          commit-message: "feat: list ${{ steps.check.outputs.id }}"
          title: "feat: list ${{ steps.check.outputs.id }}"
          body: |
            Closes #${{ github.event.issue.number }}
          labels: plugin-submission
      - name: Reply on the issue
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.check.outputs.status }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        with:
          script: |
            const fs = require("fs");
            let body = fs.readFileSync(`${process.env.RUNNER_TEMP}/comment.md`, "utf8");
            if (process.env.PR_URL) body += `\n上架 PR / Catalog pull request: ${process.env.PR_URL}\n`;
            const { owner, repo } = context.repo, issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.reverse().find((c) => c.user?.type === "Bot" && c.body?.includes("<!-- plugin-submission-validation -->"));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            if (process.env.STATUS === "failure") {
              await github.rest.issues.update({ owner, repo, issue_number, state: "closed", state_reason: "not_planned" });
            }
