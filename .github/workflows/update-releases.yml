name: Update plugin releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: catalog-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-releases.mjs --pr-body="$RUNNER_TEMP/body.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/validate.mjs
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-releases
          delete-branch: true
          commit-message: "chore: update plugin releases"
          title: "chore: update plugin releases"
          body-path: ${{ runner.temp }}/body.md
          labels: plugin-update
